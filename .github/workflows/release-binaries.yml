name: release-binaries

# Releases are cut by pushing a build-N tag (tools/ci/tag-build.sh), or by a manual run with a tag
# input, which creates the tag. A manual run without a tag only builds (artifacts, no release).
on:
  push:
    tags:
      - "build-*"
  workflow_dispatch:
    inputs:
      tag:
        description: build-N to publish (created at the commit below if missing); empty builds only
        type: string
        default: ""
      commit:
        description: Commit to build and tag (default the tip of the selected branch)
        type: string
        default: ""

permissions:
  contents: read

# Clang major the Linux PGO build uses, from apt.llvm.org. A profile is written by a current clang
# and an older reader refuses it, so this has to stay at or above whatever produced
# eglantine.profdata; bump it when a refreshed profile needs a newer LLVM.
env:
  PGO_LLVM_VERSION: "23"

# A running build is never cancelled: it finishes and publishes. A push meanwhile queues one build;
# a later push replaces it, so the newest commit builds as soon as the running one is done.
concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      sha: ${{ steps.prepare.outputs.sha }}
      publish: ${{ steps.prepare.outputs.publish }}
      prev: ${{ steps.prepare.outputs.prev }}
      latest: ${{ steps.prepare.outputs.latest }}
    steps:
      - name: Resolve commit and release tag
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag="$GITHUB_REF_NAME"
            want=""
          else
            tag="$INPUT_TAG"
            want="$INPUT_COMMIT"
          fi
          # On a tag push the tag names the commit (GITHUB_SHA can be an annotated tag's object).
          sha=$(gh api "repos/$repo/commits/${want:-${tag:-$GITHUB_SHA}}" --jq .sha)
          publish=false
          prev=""
          latest=false
          if [ -n "$tag" ]; then
            [[ "$tag" =~ ^build-[1-9][0-9]*$ ]] || { echo "::error::The tag must be build-N: $tag"; exit 1; }
            if tag_sha=$(gh api "repos/$repo/commits/$tag" --jq .sha 2> /dev/null); then
              if [ -n "$want" ] && [ "$tag_sha" != "$sha" ]; then
                echo "::error::$tag points to $tag_sha, not $sha"
                exit 1
              fi
              sha="$tag_sha"
            else
              gh api --method POST "repos/$repo/git/refs" -f "ref=refs/tags/$tag" -f "sha=$sha" > /dev/null
            fi
            if gh release view "$tag" --repo "$repo" > /dev/null 2>&1; then
              echo "::error::Release $tag already exists; delete it first to rebuild it"
              exit 1
            fi
            publish=true
            # The previous build-N release is the base of the notes; the newest one also moves dev-latest.
            n=${tag#build-}
            numbers=$(gh release list --repo "$repo" --limit 1000 --json tagName --jq '.[].tagName' |
              sed -n 's/^build-\([1-9][0-9]*\)$/\1/p' | sort -n)
            below=$(awk -v n="$n" '$1 != "" && $1 + 0 < n + 0' <<< "$numbers" | tail -n1)
            [ -z "$below" ] || prev="build-$below"
            top=$(tail -n1 <<< "$numbers")
            if [ -z "$top" ] || [ "$n" -gt "$top" ]; then latest=true; fi
          fi
          {
            echo "tag=$tag"
            echo "sha=$sha"
            echo "publish=$publish"
            echo "prev=$prev"
            echo "latest=$latest"
          } | tee -a "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.platform }} binary
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3000M
      CCACHE_COMPILERCHECK: content
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 3G
      LICHII_TAG: ${{ needs.prepare-release.outputs.tag }}
      BUILD_SHA: ${{ needs.prepare-release.outputs.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: windows-x86_64
            runner: windows-2022
          # The -pgo (clang + eglantine.profdata; MinGW on Windows), linux-aarch64 and macos-arm64
          # rows are left out: not measured on this fork's games. Their steps below are kept, so
          # restoring a row from upstream brings a platform back.

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.prepare-release.outputs.sha }}
          persist-credentials: false

      # GetSCMRev reads these instead of git: the version line then names the fork's branch, not a
      # detached HEAD ("Lichii Development Build | <owner>-dev-build-N").
      - name: Record build identity
        shell: bash
        run: |
          printf '%s\n' "$BUILD_SHA" > GIT-COMMIT
          printf '%s\n' "${GITHUB_REPOSITORY_OWNER}-dev" > GIT-REFSPEC

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'linux')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf clang cmake g++ gcc git glslang-tools libglu1-mesa-dev lld \
            libpulse-dev libtool libudev-dev libxkbcommon-x11-0 \
            mesa-common-dev nasm ninja-build qt6-base-private-dev \
            qt6-charts-dev qt6-tools-dev libavfilter-dev libavcodec-dev \
            libswscale-dev pkg-config zlib1g-dev libva-dev libvdpau-dev \
            spirv-tools spirv-headers libusb-1.0-0-dev \
            libboost-dev libboost-fiber-dev libboost-context-dev \
            libopus-dev libasound2-dev ccache \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      # The packages docs/Deps.md lists for macOS, plus ccache.
      - name: Install macOS dependencies
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install autoconf automake boost ffmpeg fmt glslang hidapi libtool libusb lz4 ninja \
            nlohmann-json openssl pkg-config qt@6 sdl3 speexdsp zlib zstd cmake catch2 molten-vk \
            vulkan-loader spirv-tools vulkan-utility-libraries ccache

      - name: Install Qt on Linux x86_64
        if: startsWith(matrix.platform, 'linux') && runner.arch != 'ARM64'
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtcharts
          cache: true

      - name: Install Qt on Linux ARM64
        if: startsWith(matrix.platform, 'linux') && runner.arch == 'ARM64'
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: "6.8.3"
          host: linux_arm64
          target: desktop
          arch: linux_gcc_arm64
          modules: qtcharts
          cache: true

      # Ubuntu's own clang 18 cannot read a profile from a current LLVM, so take clang from the LLVM
      # apt repo. The versioned packages are named explicitly: that repo's unversioned clang/lld
      # metapackages can lag the binaries they depend on and then resolve to nothing. lld-23 only
      # ships ld.lld under /usr/lib/llvm-23/bin, so -B points the linker search there.
      - name: Install clang for PGO
        if: startsWith(matrix.platform, 'linux') && matrix.pgo
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key |
            sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-$PGO_LLVM_VERSION main" |
            sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "clang-$PGO_LLVM_VERSION" "lld-$PGO_LLVM_VERSION"
          "clang-$PGO_LLVM_VERSION" --version

      # The profile is in the source tree, where both the Linux and MSYS2 configure steps read it.
      - name: Check PGO profile
        if: matrix.pgo
        shell: bash
        run: |
          set -euo pipefail
          test -s eglantine.profdata

      - name: Set up MSVC
        if: matrix.platform == 'windows-x86_64'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install Qt on Windows
        if: matrix.platform == 'windows-x86_64'
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      # MSVC is not something ccache handles well, so that job uses sccache. The other jobs use
      # ccache, which CMake enables through USE_CCACHE (externals/cmake-modules/UseCcache.cmake).
      - name: Install sccache on Windows
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'sccache.zip'
          Invoke-WebRequest -OutFile $zip https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-pc-windows-msvc.zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'sccache')
          $bin = (Get-ChildItem -Recurse -Filter sccache.exe (Join-Path $env:RUNNER_TEMP 'sccache')).DirectoryName
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install Vulkan SDK on Windows
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Verify Vulkan tools on Windows
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: glslangValidator --version

      # Eden builds its Windows PGO binaries with MSYS2's clang toolchain, so we do the same. The
      # package list is docs/Deps.md (MSYS2) plus what the bundled FFmpeg needs to compile.
      - name: Set up MSYS2
        if: matrix.mingw
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            toolchain:p clang:p lld:p cmake:p python-pip:p
            qt6-base:p qt6-charts:p qt6-tools:p qt6-translations:p qt6-svg:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p libiconv:p
            vulkan-memory-allocator:p vulkan-devel:p glslang:p enet:p opus:p
            libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p
            lerc:p graphite2:p libwebp:p libtiff:p brotli:p ccache:p

      - name: Restore CPM downloads
        id: cpm-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/cpm
          key: cpm-${{ matrix.platform }}-v2-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'CMakeModules/CPM*.cmake', 'externals/**/CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-${{ matrix.platform }}-v2-
            cpm-${{ runner.os }}-

      - name: Restore compiler objects
        id: compiler-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            .ccache
            .sccache
          key: objects-${{ matrix.platform }}-v2-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            objects-${{ matrix.platform }}-v2-${{ github.sha }}-
            objects-${{ matrix.platform }}-v2-

      - name: Configure Linux
        if: startsWith(matrix.platform, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          flags=(
            -DCMAKE_BUILD_TYPE=Release
            -DBUILD_TESTING=OFF
            -DYUZU_TESTS=OFF
            -DYUZU_CMD=ON
            -DYUZU_ROOM=OFF
            -DYUZU_ROOM_STANDALONE=OFF
            -DYUZU_USE_BUNDLED_QT=OFF
            "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR"
            -DYUZU_USE_BUNDLED_SDL3=ON
            -DVulkanHeaders_FORCE_BUNDLED=ON
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON
            -DENABLE_UPDATE_CHECKER=ON
            -DLICHII_BUILD_TAG=${{ needs.prepare-release.outputs.tag }}
            -DLICHII_BUILD_PLATFORM=${{ matrix.platform }}
            -DLICHII_UPDATE_REPO=${{ github.repository }}
            -DUSE_DISCORD_PRESENCE=OFF
            -DUSE_CCACHE=ON
          )
          if [ '${{ matrix.pgo }}' = 'true' ]; then
            # Same flags Eden's CI passes for its clang PGO build.
            profile="-fprofile-use=$PWD/eglantine.profdata -Wno-backend-plugin \
              -Wno-profile-instr-unprofiled -Wno-profile-instr-out-of-date"
            flags+=(
              "-DCMAKE_C_COMPILER=clang-$PGO_LLVM_VERSION"
              "-DCMAKE_CXX_COMPILER=clang++-$PGO_LLVM_VERSION"
              "-DCMAKE_EXE_LINKER_FLAGS=-B/usr/lib/llvm-$PGO_LLVM_VERSION/bin -fuse-ld=lld"
              "-DCMAKE_C_FLAGS=$profile"
              "-DCMAKE_CXX_FLAGS=$profile"
            )
          else
            # clang ThinLTO with lld, as the fork's benchmarked builds: 0.7 ms a frame faster than
            # the plain GCC Release build on the Ocarina of Time routes, same pictures.
            flags+=(
              -DCMAKE_C_COMPILER=clang
              -DCMAKE_CXX_COMPILER=clang++
              -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld
              -DENABLE_LTO=ON
            )
          fi
          cmake -S . -B build/release -G Ninja "${flags[@]}"

      - name: Configure Windows
        if: matrix.platform == 'windows-x86_64'
        shell: bash
        run: >-
          cmake -S . -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DYUZU_TESTS=OFF
          -DYUZU_CMD=ON
          -DYUZU_ROOM=OFF
          -DYUZU_ROOM_STANDALONE=OFF
          -DYUZU_USE_BUNDLED_QT=OFF
          -DYUZU_USE_BUNDLED_SDL3=ON
          -DENABLE_UPDATE_CHECKER=ON
          -DLICHII_BUILD_TAG=${{ needs.prepare-release.outputs.tag }}
          -DLICHII_BUILD_PLATFORM=${{ matrix.platform }}
          -DLICHII_UPDATE_REPO=${{ github.repository }}
          -DUSE_DISCORD_PRESENCE=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Configure macOS
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DYUZU_TESTS=OFF \
            -DYUZU_CMD=ON \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF \
            "-DCMAKE_PREFIX_PATH=$(brew --prefix qt@6);$(brew --prefix zlib)" \
            "-DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" \
            -DVulkanHeaders_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_UPDATE_CHECKER=ON \
            -DLICHII_BUILD_TAG=${{ needs.prepare-release.outputs.tag }} \
            -DLICHII_BUILD_PLATFORM=${{ matrix.platform }} \
            -DLICHII_UPDATE_REPO=${{ github.repository }} \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DUSE_CCACHE=ON

      # MinGW build: system Qt and libraries from MSYS2, clang plus the repo's PGO profile. The profile
      # path is converted to its Windows form because clang runs with the MSYS mount underneath.
      - name: Configure MinGW PGO
        if: matrix.mingw
        shell: msys2 {0}
        run: |
          set -euo pipefail
          profile="-fprofile-use=$(cygpath -m "$PWD/eglantine.profdata") -Wno-backend-plugin \
            -Wno-profile-instr-unprofiled -Wno-profile-instr-out-of-date"
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DYUZU_TESTS=OFF \
            -DYUZU_CMD=ON \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            -DYUZU_USE_BUNDLED_FFMPEG=ON \
            -DVulkanHeaders_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_UPDATE_CHECKER=ON \
            -DLICHII_BUILD_TAG=${{ needs.prepare-release.outputs.tag }} \
            -DLICHII_BUILD_PLATFORM=${{ matrix.platform }} \
            -DLICHII_UPDATE_REPO=${{ github.repository }} \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DUSE_CCACHE=ON \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld \
            "-DCMAKE_C_FLAGS=$profile" \
            "-DCMAKE_CXX_FLAGS=$profile"

      - name: Save CPM downloads
        if: steps.cpm-cache.outputs.cache-hit != 'true' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/cpm
          key: ${{ steps.cpm-cache.outputs.cache-primary-key }}

      - name: Build
        if: ${{ ! matrix.mingw }}
        shell: bash
        run: |
          if command -v ccache > /dev/null; then ccache --zero-stats; else sccache --zero-stats; fi
          # -k 0: a failing build reports every broken translation unit, not only the first.
          cmake --build build/release --target yuzu yuzu-cmd --parallel -- -k 0
          if command -v ccache > /dev/null; then ccache --show-stats; else sccache --show-stats; fi

      - name: Build MinGW PGO
        if: matrix.mingw
        shell: msys2 {0}
        run: |
          ccache --zero-stats
          cmake --build build/release --target yuzu yuzu-cmd --parallel
          ccache --show-stats

      - name: Stop sccache on Windows
        if: always() && matrix.platform == 'windows-x86_64' && steps.compiler-cache.outcome == 'success'
        shell: pwsh
        run: sccache --stop-server

      - name: Save compiler objects
        if: always() && steps.compiler-cache.outcome == 'success' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            .ccache
            .sccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      # Plain tar.gz with the two programs and switch defaults. GitHub artifacts drop executable
      # bits, so a tar preserves them. This needs Qt 6 and the usual system libraries installed.
      - name: Package Linux tar.gz
        if: startsWith(matrix.platform, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          test -x build/release/bin/lichii
          test -x build/release/bin/eden-cli
          strip build/release/bin/lichii build/release/bin/eden-cli
          tar -czf "lichii-${GITHUB_SHA}-${{ matrix.platform }}.tar.gz" \
            -C build/release/bin lichii eden-cli nx2_switches.txt
          ls -la "lichii-${GITHUB_SHA}-${{ matrix.platform }}.tar.gz"

      # A self-contained AppImage: linuxdeploy bundles every library the two programs need except
      # the base system ones (glibc, X11/Wayland client libraries, the GPU driver and Vulkan loader),
      # and its Qt plugin adds the Qt libraries and platform plugins. Runs on glibc 2.39+ systems.
      - name: Package Linux AppImage
        if: startsWith(matrix.platform, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          test -x build/release/bin/lichii
          test -x build/release/bin/eden-cli
          tools="$RUNNER_TEMP/linuxdeploy"
          mkdir -p "$tools"
          arch=$(uname -m)   # aarch64 or x86_64
          curl -fsSL -o "$tools/linuxdeploy-$arch.AppImage" \
          https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-$arch.AppImage
          curl -fsSL -o "$tools/linuxdeploy-plugin-qt-$arch.AppImage" \
          https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-$arch.AppImage
          chmod +x "$tools"/*.AppImage
          # The desktop file names its icon io.github.zortos293.lichii.
          icon="$RUNNER_TEMP/io.github.zortos293.lichii.png"
          cp dist/lichii.png "$icon"
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          # Include Wayland platform plugins and their graphics/shell integrations.
          export EXTRA_QT_MODULES=waylandcompositor
          export EXTRA_PLATFORM_PLUGINS='libqwayland-egl.so;libqwayland-generic.so'
          # Embedded in the AppImage metadata: the release tag (build-N) plus the commit.
          export LDAI_VERSION="${LICHII_TAG:-dev}-${BUILD_SHA::7}"
          export LDAI_OUTPUT="lichii-${GITHUB_SHA}-${{ matrix.platform }}.AppImage"
          export OUTPUT="$LDAI_OUTPUT"
          export ARCH="$arch"
          mkdir -p AppDir/usr/bin
          cp build/release/bin/nx2_switches.txt AppDir/usr/bin/
          "$tools/linuxdeploy-$arch.AppImage" --appdir AppDir \
            --executable build/release/bin/lichii \
            --executable build/release/bin/eden-cli \
            --desktop-file dist/io.github.zortos293.lichii.desktop \
            --icon-file "$icon" \
            --plugin qt \
            --output appimage
          test -s "$LDAI_OUTPUT"
          ls -la "$LDAI_OUTPUT"

      - name: Package Windows binary
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: |
          foreach ($exe in 'lichii.exe', 'eden-cli.exe') {
            if (-not (Test-Path "build/release/bin/$exe")) {
              throw "build/release/bin/$exe was not produced"
            }
          }
          windeployqt --release --no-translations build/release/bin/lichii.exe

      # A dynamic MinGW build is not portable on its own: windeployqt6 brings the Qt libraries and
      # plugins, then every non-system DLL the binaries and those plugins pull in gets copied next to
      # them (docs/Caveats.md#msys2).
      - name: Package MinGW binary
        if: matrix.mingw
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:$PATH"
          cd build/release/bin
          test -f lichii.exe
          test -f eden-cli.exe
          windeployqt6 --no-translations --no-compiler-runtime --no-opengl-sw \
            --no-system-dxc-compiler --no-system-d3d-compiler lichii.exe
          deps() {
            objdump -p "$1" | awk '/DLL Name:/ {print $3}' | while read -r dll; do
              [ -z "$dll" ] && continue
              source=$(command -v "$dll" 2>/dev/null || true)
              [ -z "$source" ] && continue
              # The system DLLs ship with Windows, so they never need bundling.
              case "$source" in
                *System32* | *SysWOW64*) continue ;;
              esac
              if [ ! -f "$dll" ]; then
                cp "$source" "$dll"
                deps "$source"
              fi
            done
          }
          for exe in lichii.exe eden-cli.exe; do
            deps "$exe"
          done
          find . -name '*.dll' | while read -r dll; do
            deps "$dll"
          done

      # A self-contained app bundle: macdeployqt copies Qt and every other Homebrew library both
      # programs load into the bundle, then the leftover Homebrew search paths are removed so a
      # machine with Homebrew still uses the bundled copies. Ad-hoc signed, not notarized.
      - name: Package macOS app
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          app=build/release/bin/lichii.app
          test -x "$app/Contents/MacOS/lichii"
          test -x build/release/bin/eden-cli
          cp build/release/bin/eden-cli "$app/Contents/MacOS/eden-cli"
          "$(brew --prefix qt@6)/bin/macdeployqt" "$app" \
            -executable="$app/Contents/MacOS/eden-cli" -libpath="$(brew --prefix)/lib" \
            -always-overwrite -verbose=1
          # Qt's virtual keyboard input plugin pulls in the QML stack, which the emulator doesn't use.
          rm -f "$app/Contents/PlugIns/platforminputcontexts/libqtvirtualkeyboardplugin.dylib"
          binaries=$(find "$app/Contents" -type f \( -perm -u+x -o -name '*.dylib' \) \
            -exec sh -c 'file -b "$1" | grep -q Mach-O' _ {} \; -print)
          for binary in $binaries; do
            otool -l "$binary" | awk '/cmd LC_RPATH/ {getline; getline; print $2}' |
              { grep -E '^/(opt/homebrew|usr/local)/' || true; } | while read -r rpath; do
                install_name_tool -delete_rpath "$rpath" "$binary" 2> /dev/null
              done
          done
          # Libraries that load their dependencies through @rpath find them in the bundle.
          for program in lichii eden-cli; do
            install_name_tool -add_rpath @executable_path/../Frameworks \
              "$app/Contents/MacOS/$program" 2> /dev/null
          done
          leaks=$(for binary in $binaries; do
            otool -L "$binary" | grep -E '^\s+/(opt/homebrew|usr/local)/'
            otool -l "$binary" | awk '/cmd LC_RPATH/ {getline; getline; print $2}' |
              grep -E '^/(opt/homebrew|usr/local)/'
          done || true)
          if [ -n "$leaks" ]; then
            echo "References still pointing outside the bundle:"
            echo "$leaks" | sort -u
            exit 1
          fi
          # macdeployqt invalidates the signatures. The programs get the entitlements when the
          # tree has them (the Hypervisor CPU backend needs com.apple.security.hypervisor).
          codesign --force --deep --sign - "$app"
          if [ -f dist/eglantine.entitlements ]; then
            codesign --force --sign - --entitlements dist/eglantine.entitlements \
              "$app/Contents/MacOS/eden-cli"
            codesign --force --sign - --entitlements dist/eglantine.entitlements "$app"
          fi
          codesign --verify --deep --strict "$app"
          ditto -c -k --keepParent "$app" "lichii-${GITHUB_SHA}-${{ matrix.platform }}.zip"
          ls -la "lichii-${GITHUB_SHA}-${{ matrix.platform }}.zip"
          # Also ship a .dmg (drag lichii.app onto Applications).
          dmgdir=$(mktemp -d)
          ditto "$app" "$dmgdir/lichii.app"
          ln -s /Applications "$dmgdir/Applications"
          hdiutil create -volname "Lichii" -srcfolder "$dmgdir" -ov -format UDZO \
            "lichii-${GITHUB_SHA}-${{ matrix.platform }}.dmg"
          ls -la "lichii-${GITHUB_SHA}-${{ matrix.platform }}.dmg"

      # The artifact is the bin folder itself: GitHub zips artifacts on download, and uploading a
      # zip gave a zip inside a zip. The release job zips it once for the release.
      - name: Upload Windows binary
        if: matrix.platform == 'windows-x86_64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lichii-${{ matrix.platform }}-${{ github.sha }}
          path: build/release/bin/
          if-no-files-found: error
          retention-days: 7

      - name: Upload MinGW binary
        if: matrix.mingw
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lichii-${{ matrix.platform }}-${{ github.sha }}
          path: build/release/bin/
          if-no-files-found: error
          retention-days: 7

      # Both Linux files go in one artifact: the tar.gz and the AppImage.
      - name: Upload Linux binary
        if: startsWith(matrix.platform, 'linux')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lichii-${{ matrix.platform }}-${{ github.sha }}
          path: |
            lichii-${{ github.sha }}-${{ matrix.platform }}.tar.gz
            lichii-${{ github.sha }}-${{ matrix.platform }}.AppImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      # Zipped with ditto beforehand: the bundle's framework symlinks don't survive artifact zipping.
      - name: Upload macOS app
        if: startsWith(matrix.platform, 'macos')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lichii-${{ matrix.platform }}-${{ github.sha }}
          path: |
            lichii-${{ github.sha }}-${{ matrix.platform }}.zip
            lichii-${{ github.sha }}-${{ matrix.platform }}.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7


  # Publishes every binary as the build-N pre-release once every platform built, then points the
  # rolling dev-latest pre-release at the same files when build-N is the newest release.
  release:
    name: Publish release
    needs: [prepare-release, build]
    if: needs.prepare-release.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-publish-${{ github.repository }}
      cancel-in-progress: false
    env:
      TAG: ${{ needs.prepare-release.outputs.tag }}
      SHA: ${{ needs.prepare-release.outputs.sha }}
      PREV_TAG: ${{ needs.prepare-release.outputs.prev }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # History without file contents, for the commit lists in the notes.
      - name: Check out history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.prepare-release.outputs.sha }}
          path: src
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Download binaries
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: lichii-*-${{ github.sha }}
          path: artifacts

      - name: Package release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          # Asset names drop the commit sha: the release tag already identifies the build, and
          # stable names let the notes table link to them.
          strip_sha() { sed "s/-${GITHUB_SHA}//" <<< "$1"; }
          for artifact in artifacts/*/; do
            name=$(basename "$artifact")
            if compgen -G "$artifact*.AppImage" > /dev/null; then
              # Linux: ship the AppImage and the tar.gz as they are.
              for file in "$artifact"*.AppImage "$artifact"*.tar.gz; do
                cp "$file" "dist/$(strip_sha "$(basename "$file")")"
              done
            elif compgen -G "$artifact*.zip" > /dev/null; then
              for file in "$artifact"*.zip "$artifact"*.dmg; do
                [[ -e "$file" ]] && cp "$file" "dist/$(strip_sha "$(basename "$file")")"
              done
            else
              (cd "$artifact" && zip -qr "${GITHUB_WORKSPACE}/dist/$(strip_sha "$name").zip" .)
            fi
          done
          ls -la dist

      # The notes name the upstream commit the build is based on (this repository's parent).
      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          read -r parent branch < <(gh api "repos/$GITHUB_REPOSITORY" \
            --jq '[.parent.full_name // "", .parent.default_branch // ""] | join(" ")') || true
          ref=""
          if [ -n "${parent:-}" ] && [ -n "${branch:-}" ] &&
            git -C src fetch --quiet --no-tags --filter=blob:none "https://github.com/$parent.git" \
              "+refs/heads/$branch:refs/remotes/upstream/$branch"; then
            ref="refs/remotes/upstream/$branch"
          fi
          cd src
          export REPO="$GITHUB_REPOSITORY" ASSET_DIR=../dist
          export UPSTREAM_REPO="${parent:-}" UPSTREAM_BRANCH="${branch:-}" UPSTREAM_REF="$ref"
          bash tools/ci/dev-release-notes.sh ../notes.md
          LINK_TAG=dev-latest bash tools/ci/dev-release-notes.sh ../latest.md
          cat ../notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create release
        shell: bash
        run: |
          set -euo pipefail
          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha)
          if [ "$tag_sha" != "$SHA" ]; then
            echo "Release tag ${TAG} points to $tag_sha instead of $SHA"
            exit 1
          fi
          gh release create "${TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --prerelease \
            --title "Lichii dev build ${TAG#build-} (${SHA::7})" \
            --notes-file notes.md

      - name: Update dev-latest
        if: needs.prepare-release.outputs.latest == 'true'
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          if ! gh api --method PATCH "repos/$repo/git/refs/tags/dev-latest" \
            -f "sha=$SHA" -F force=true > /dev/null 2>&1; then
            gh api --method POST "repos/$repo/git/refs" -f "ref=refs/tags/dev-latest" -f "sha=$SHA" > /dev/null
          fi
          title="Lichii dev latest (build ${TAG#build-}, ${SHA::7})"
          if gh release view dev-latest --repo "$repo" > /dev/null 2>&1; then
            gh release upload dev-latest dist/* --repo "$repo" --clobber
            gh release edit dev-latest --repo "$repo" --prerelease --title "$title" --notes-file latest.md
          else
            gh release create dev-latest dist/* --repo "$repo" --verify-tag --prerelease \
              --title "$title" --notes-file latest.md
          fi
